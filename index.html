
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMSUB Translator</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 20px;
}
h1 { color: #42a5ff; text-align: center; }
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}
textarea {
  width: 100%;
  height: 130px;
  box-sizing: border-box;
  padding: 15px;
  border-radius: 10px;
  font-size: 17px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: #1684ee;
  color: white;
  font-size: 17px;
}
#result {
  background: white;
  color: black;
  padding: 15px;
  border-radius: 10px;
  min-height: 50px;
}
</style>
</head>
<body>

<h1>🌐 MMSUB</h1>
<p style="text-align:center">
Thai → Myanmar Translator
</p>

<div class="card">
<h3>ထိုင်းစာထည့်ပါ</h3>
<textarea id="thai" placeholder="ထိုင်းစာကို ဒီမှာထည့်ပါ..."></textarea>

<button onclick="translateText()">
ဘာသာပြန်မယ်
</button>

<h3>မြန်မာဘာသာပြန်</h3>
<div id="result">ဘာသာပြန်ချက် ဒီမှာပေါ်လာမယ်။</div>
</div>

<script>
function translateText() {
 const text = document.getElementById("thai").value.trim();
 if (!text) {
   alert("ထိုင်းစာထည့်ပါ");
   return;
 }
 const url = "https://translate.google.com/?sl=th&tl=my&text="
   + encodeURIComponent(text) + "&op=translate";
 window.open(url, "_blank");
}
</script>

</body>
</html>
